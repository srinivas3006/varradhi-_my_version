name: way2news_clone
description: A Way2News-style vertical news feed app (UI clone, frontend only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_tts: ^4.0.2
  youtube_player_flutter: ^10.0.1
  dio: ^5.10.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  video_player: ^2.12.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
